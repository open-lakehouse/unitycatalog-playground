# Backend database for the bundled Unity Catalog server (server.env=dev).
# Matches the postgres service in docker-compose.yaml (profile local-uc).
# Credentials mirror Unity Catalog's etc/db/postgres-example.yml defaults.
#
# Prefer hibernate.connection.username (standard Hibernate key); the docs'
# hibernate.connection.user alias is also accepted by JCasbinAuthorizer.

hibernate.connection.driver_class=org.postgresql.Driver
hibernate.connection.url=jdbc:postgresql://postgres:5432/ucdb
hibernate.connection.username=uc_default_user
hibernate.connection.password=uc_default_password

hibernate.hbm2ddl.auto=update
hibernate.show_sql=false
hibernate.archive.autodetection=class
hibernate.use_sql_comments=true
org.hibernate.SQL=INFO
org.hibernate.type.descriptor.sql.BasicBinder=TRACE
