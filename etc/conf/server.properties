server.env=dev
## Identity Provider authorization parameters
# examples:
# authorization=enable
# authorization-url=https://accounts.google.com/o/oauth2/auth
# token-url=https://oauth2.googleapis.com/token
# client-id=111122223333-abab1212cdcd3434.apps.googleusercontent.com
# client-secret=GOCSPX-ababfoobarcdcd-5q
server.authorization=disable
server.authorization-url=
server.token-url=
server.client-id=
server.client-secret=
server.redirect-port=
# D-Days H-Hours M-Minutes S-Seconds (P5D = 5 days,PT5H = 5 hours, PT5M = 5 minutes, PT5S = 5 seconds)
server.cookie-timeout=P5D

## Experimental Feature Flags
# Enable MANAGED table (experimental feature)
# Default: false (disabled)
server.managed-table.enabled=true

# Managed tables live in the bundled RustFS S3 object store (uc=local), so the
# storage root is an s3:// URI rather than a local path. @S3_BUCKET@ is rendered
# by etc/rustfs/bootstrap.sh at container startup (see docker-compose.yaml).
storage-root.tables=s3://@S3_BUCKET@

#### AWS credential configs

# The master role ARN for AwsIamRole storage credential. This should be set to the same ARN that
# the UC server is running as. If the server is running on-premises and using an IAM user, this
# ARN can also be set to the IAM user. It will be advertised as unity_catalog_iam_arn in AWS
# credential securables to users so that they know which UC role (or user) to trust by their
# storage role.
aws.masterRoleArn=
# The AWS credential of masterRoleArn to be used by server. If not set, server uses the
# DefaultCredentialsProvider.
aws.accessKey=
aws.secretKey=
# The region of AWS. If running on-premises, pick the nearest region.
aws.region=

#### The following "s3.*" configs are legacy per-bucket hardcoded credential config

## S3 Storage Config (Multiple configs can be added by incrementing the index)
#
# For the bundled local stack these point at RustFS. bucketPath / region are
# rendered from @S3_BUCKET@ / @S3_REGION@ by etc/rustfs/bootstrap.sh; the three
# credential lines below are left blank on purpose and OVERRIDDEN at the end of
# this file with freshly-minted RustFS STS credentials (Java Properties keeps
# the last definition of a key). This is what makes UC vend usable static creds
# for a non-AWS S3 store: AwsCredentialVendor returns static credentials only
# when a session token is present, otherwise it falls back to AWS STS.
s3.bucketPath.0=s3://@S3_BUCKET@
s3.region.0=@S3_REGION@
s3.awsRoleArn.0=
# Optional (If blank, it will use DefaultCredentialsProviderChain)
s3.accessKey.0=
s3.secretKey.0=
# Test Only (If you provide a session token, it will just use those session creds, no downscoping)
s3.sessionToken.0=

## ADLS Storage Config (Multiple configs can be added by incrementing the index)
adls.storageAccountName.0=
adls.tenantId.0=
adls.clientId.0=
adls.clientSecret.0=

## GCS Storage Config (Multiple configs can be added by incrementing the index)
gcs.bucketPath.0=
# Optional (If blank, it will use Default Application chain to find credentials)
gcs.jsonKeyFilePath.0=