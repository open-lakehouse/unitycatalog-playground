[project]
name = "marimo-playground"
version = "0.1.0"
description = "A marimo notebook playground for exploring Unity Catalog"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "marimo[recommended]==0.23.16",
    "numpy==2.2.6",
]

# One group per notebook image. iceberg-spark-runtime is only published for
# Spark 4.0/4.1, so the Iceberg notebooks can't share the Delta Spark 4.2 line.
[dependency-groups]
# marimo-spark (:2718): requirements.lock
delta = [
    "delta-spark==4.4.0",
    "pyspark==4.2.0",
]
# marimo-iceberg (:2719): requirements-iceberg.lock
iceberg = [
    "pyiceberg[pyarrow,pandas,pyiceberg-core]==0.12.0",
    "pyspark==4.1.3",
]

[tool.uv]
default-groups = ["delta"]
conflicts = [[{ group = "delta" }, { group = "iceberg" }]]
