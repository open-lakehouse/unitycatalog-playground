name: unitycatalog-playground

services:
  # Bundled local Unity Catalog server. Gated behind the `local-uc` profile so a
  # plain `docker compose up` runs ONLY marimo-spark (talking to a remote/managed
  # UC). Start this too with:  docker compose --profile local-uc up
  # (or via the Justfile:  just uc=local up).
  # See https://github.com/unitycatalog/unitycatalog/blob/main/compose.yaml.
  #
  # Metadata is stored in the companion `postgres` service (UC v0.6+). Point
  # etc/conf/hibernate.properties at that DB; the JDBC driver ships with the
  # server image via the casbin jdbc-adapter transitive dependency.
  #
  # Managed table DATA lives in the `rustfs` S3 object store (not a local file
  # path). The server config is rendered into the `uc_conf` volume by the
  # `rustfs-init` one-shot, which injects freshly-minted RustFS S3 credentials
  # into server.properties — hence the depends_on service_completed_successfully.
  unitycatalog:
    profiles:
      - local-uc
    image: newfrontdocker/unitycatalog:v0.6.0
    hostname: unitycatalog
    container_name: unitycatalog
    depends_on:
      postgres:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    volumes:
      # etc/conf (server.properties + hibernate.properties + log4j2) is populated
      # by rustfs-init from ./etc/conf, with live S3 creds injected. Using a volume
      # (rather than bind-mounting the individual files) avoids a chicken-and-egg
      # with the runtime-rendered server.properties.
      - type: volume
        source: uc_conf
        target: /home/unitycatalog/etc/conf
    networks:
      - unity

  # RustFS — S3-compatible object store that backs the bundled local Unity
  # Catalog (uc=local). Replaces the old ./uc_data file bind mount so managed
  # tables live on real object storage (s3://…), closely mirroring a cloud UC.
  # S3 API on :9000, web console on :9001 (log in with RUSTFS_ACCESS_KEY/SECRET).
  rustfs:
    profiles:
      - local-uc
    image: rustfs/rustfs:latest
    hostname: rustfs
    container_name: rustfs
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      # Local dev root credentials. Override in .env for anything exposed.
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
    ports:
      - "${RUSTFS_API_PORT:-9000}:9000"
      - "${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      # Object data. A named volume inherits the image's /data ownership on first
      # init, so no permission helper is needed (unlike a host bind mount).
      - type: volume
        source: rustfs_data
        target: /data
    networks:
      - unity

  # One-shot bootstrap for the local S3 stack: waits for RustFS, creates the UC
  # bucket, mints a short-lived STS credential (AssumeRole), and renders the UC
  # server config into the `uc_conf` volume with those creds. See
  # etc/rustfs/bootstrap.sh for the why (v0.6 UC + non-AWS S3 credential vending).
  # The STS credential expires (default 12h) — refresh via `just uc=local rotate-creds`.
  rustfs-init:
    profiles:
      - local-uc
    image: amazon/aws-cli:latest
    container_name: rustfs-init
    depends_on:
      rustfs:
        condition: service_started
    entrypoint: ["/bin/sh", "/bootstrap/bootstrap.sh"]
    environment:
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      UC_STORAGE_BUCKET: ${UC_STORAGE_BUCKET:-uc-warehouse}
      S3_REGION: ${S3_REGION:-us-east-1}
      STS_DURATION_SECONDS: ${STS_DURATION_SECONDS:-43200}
    volumes:
      - type: bind
        source: ./etc/rustfs/bootstrap.sh
        target: /bootstrap/bootstrap.sh
        read_only: true
      - type: bind
        source: ./etc/conf
        target: /templates
        read_only: true
      - type: volume
        source: uc_conf
        target: /conf
    networks:
      - unity

  # PostgreSQL metadata store for the bundled UC server (UC v0.6+).
  # Image/version and credentials match Unity Catalog's etc/db/postgres-example.yml.
  # Data lives in the named volume `uc_postgres_data`, which survives
  # `just down` / container restarts. Wipe with `just clean` (or
  # `docker compose --profile local-uc down --volumes`).
  postgres:
    profiles:
      - local-uc
    image: postgres:16.3
    hostname: postgres
    container_name: unitycatalog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ucdb}
      POSTGRES_USER: ${POSTGRES_USER:-uc_default_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uc_default_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Official image data dir (UC's postgres-example.yml incorrectly used
      # /var/lib/postgres — that path does not persist PGDATA).
      - type: volume
        source: uc_postgres_data
        target: /var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - unity

  marimo-spark:
    image: marimo-spark:latest
    build:
      context: .
      args:
        # Optional PyPI proxy for internal/corporate builds (e.g. Databricks).
        # Sourced from .env (see .env.example); blank -> default public PyPI.
        PYPI_PROXY_URL: ${PYPI_PROXY_URL:-}
        # Optional pre-release override: filename of a wheel staged under
        # spark/delta-override/ (see `just stage-delta`). Blank -> PyPI delta-spark.
        DELTA_SPARK_WHEEL: ${DELTA_SPARK_WHEEL:-}
    hostname: marimo-spark
    container_name: marimo-spark
    # Lets the container reach services published on the host (e.g. a Unity
    # Catalog server running in a separate compose project).
    # Required on Linux/colima; harmless on Docker Desktop where it already resolves.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - MAVEN_PROXY_URL
      # Point Spark at the mounted host Ivy repo (see the ivy2 bind mount below)
      # so it can resolve locally published SNAPSHOTs such as unitycatalog-spark.
      # Spark's local-ivy-cache resolver searches `${spark.jars.ivy}/local`.
      - SPARK_JARS_IVY=/opt/ivy2
      # URL the notebook uses to reach Unity Catalog. Defaults to the bundled
      # `unitycatalog` service (reachable over the `unity` bridge by hostname).
      # For a remote/managed UC, override UC_SERVER_URL / UC_SERVER_PORT in .env.
      # Keep this a BARE host (no scheme): the notebook combines it with
      # UC_SERVER_PORT into http://<host>:<port>. A scheme-qualified value
      # (http://unitycatalog) is used verbatim and drops the port -> connects to
      # port 80 -> java.net.ConnectException. Use a full URL only when it already
      # includes the port (or a remote UC on 443).
      - UC_SERVER_URL=${UC_SERVER_URL:-unitycatalog}
      - UC_SERVER_PORT=${UC_SERVER_PORT:-8080}
      # Bearer token for an auth-enabled Unity Catalog server (see .env.example).
      # Blank for the local quickstart server, which runs without auth.
      - UC_TOKEN=${UC_TOKEN:-}
      # S3 endpoint the notebooks point Spark's S3A client at. `just uc=local`
      # sets this to the in-network RustFS service (http://rustfs:9000). Blank
      # for AWS S3 or a remote UC backed by real S3 — the notebooks then skip the
      # custom-endpoint / path-style / plaintext toggles.
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-}
      - S3_REGION=${S3_REGION:-us-east-1}
    volumes:
      - type: bind
        source: ./marimo-playground/notebooks
        target: /opt/workspace/marimo-playground/notebooks
      # Mount the host's local Ivy repository so Spark can resolve jars you
      # published with `bin/sbt publishLocal` (these live in ~/.ivy2/local on the
      # host). Mounted read-write so Spark can also update its resolution cache.
      # Override the host path by setting HOST_IVY_DIR in .env (see .env.example).
      - type: bind
        source: ${HOST_IVY_DIR:-${HOME}/.ivy2}
        target: /opt/ivy2
      # Host ./spark mounted at /spark, providing:
      #   - /spark/jars: pre-downloaded jars (delta / unitycatalog / hadoop-aws,
      #     etc). Populate with `just jars` to speed up notebook startup. The
      #     actual jars are git-ignored; the dir is kept via spark/jars/.gitkeep.
      #   - /spark/ivysettings.xml: proxy-only Ivy resolver template used by
      #     `just jars` so resolution skips the firewalled Maven Central /
      #     spark-packages defaults and goes straight to MAVEN_PROXY_URL.
      - type: bind
        source: ./spark
        target: /spark
    ports:
      - "2718:2718"
    networks:
      - unity
      # Shared external network so marimo-spark can also reach a UC server that
      # lives in a *separate* compose project (which joins the same network).
      # The network must exist first — create it idempotently with `just net`
      # (the up/jars recipes do this automatically): docker network create uc-shared
      - uc-shared

networks:
  unity:
    driver: bridge
  uc-shared:
    external: true

volumes:
  # Persists Unity Catalog metadata across `just down` / container restarts.
  # Removed only by `just clean` or an explicit `docker compose ... down --volumes`.
  uc_postgres_data:
  # Managed table DATA for the bundled local UC (RustFS object store). Wiped by
  # `just clean` / `just down-volumes`.
  rustfs_data:
  # UC server config (etc/conf) rendered by rustfs-init with live S3 creds.
  # Ephemeral — always regenerated on the next `up`.
  uc_conf:
